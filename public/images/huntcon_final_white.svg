    <path d="M 1130 245 L 1205 298 L 1254 319 L 1180 268 Z" fill="#12B8F4"/>
    <line x1="375" y1="248" x2="395" y2="235" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
    <line x1="575" y1="215" x2="598" y2="195" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
    <line x1="635" y1="150" x2="650" y2="135" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
    <line x1="870" y1="175" x2="887" y2="160" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
    <line x1="1150" y1="240" x2="1170" y2="225" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
