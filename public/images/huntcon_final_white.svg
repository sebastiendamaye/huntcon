<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>HUNTCON 2027 logo white</title>
  <desc>Threat hunting conference logo with mountains, HUNTCON wordmark and target-shaped O.</desc>
  <defs>
