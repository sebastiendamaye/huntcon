    <path d="M 265 305 L 360 225 L 430 266 L 382 252 L 355 286 L 300 314 Z" fill="#FFFFFF"/>
    <path d="M 430 275 L 650 120 L 732 203 L 710 168 L 690 195 L 675 140 L 650 202 L 635 165 L 612 224 L 560 185 L 500 244 Z" fill="#FFFFFF"/>
