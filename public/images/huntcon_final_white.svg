    <path d="M 300 316 L 366 261 L 430 265 L 346 330 Z" fill="#12B8F4"/>
    <path d="M 525 268 L 610 215 L 578 282 L 487 332 Z" fill="#12B8F4"/>
    <path d="M 770 182 L 840 214 L 892 286 L 832 248 Z" fill="#12B8F4"/>
