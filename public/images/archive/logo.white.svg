<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">HUNTCON 2027 logo - dark red target year bars</title>
  <desc id="desc">Transparent vector logo for HUNTCON 2027 with mountain, snow facets, fully dark red target, white HUNTCON wordmark, dark red 2027 with dark red horizontal bars, and conference tagline.</desc>

  <defs>
    <style><![CDATA[
      :root {
        --mountain: #E6EEF8;
        --mountain-shadow: #8FA6BF;
        --word: #FFFFFF;
        --dark-red: #8B1E1E;
        --tagline: #A0AEC0;
      }
      .mountain { fill: var(--mountain); }
      .shadow { fill: var(--mountain-shadow); opacity: 0.85; }
      .word { fill: var(--word); }
      .red-fill { fill: var(--dark-red); }
      .red-stroke { fill: none; stroke: var(--dark-red); stroke-linecap: round; stroke-linejoin: round; }
      .year-bar { fill: none; stroke: var(--dark-red); stroke-width: 10; stroke-linecap: round; }
      .tagline { fill: var(--tagline); }
      .wordmark { font-family: 'Arial Black', 'Impact', 'Montserrat ExtraBold', sans-serif; font-weight: 900; letter-spacing: 20px; }
      .year { font-family: 'Arial Black', 'Impact', 'Montserrat ExtraBold', sans-serif; font-weight: 900; letter-spacing: 28px; }
      .tagtext { font-family: 'Arial', 'Montserrat', sans-serif; font-weight: 800; letter-spacing: 18px; }
    ]]></style>
  </defs>

  <!-- Transparent background by design: no background rectangle. -->

  <g transform="translate(0,30)">
    <path class="mountain" d="M185 700 L315 560 L380 620 L530 395 L615 485 L800 185 L985 525 L1125 425 L1425 715 L1288 680 L1148 535 L1040 650 L962 575 L802 305 L630 645 L545 540 L430 695 L350 615 L245 725 Z"/>
    <path class="shadow" d="M800 235 L870 390 L822 350 L762 450 L790 320 L732 385 Z"/>
    <path class="shadow" d="M530 415 L600 492 L548 474 L500 610 Z"/>
    <path class="shadow" d="M1125 448 L1230 600 L1170 570 L1105 660 Z"/>
    <path class="shadow" opacity="0.65" d="M630 645 L700 492 L662 528 L575 675 Z"/>
  </g>

  <g transform="translate(800,700)">
    <circle cx="0" cy="0" r="58" fill="none" stroke="#8B1E1E" stroke-width="12"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#8B1E1E" stroke-width="6"/>
    <circle cx="0" cy="0" r="11" fill="#8B1E1E"/>
    <circle cx="0" cy="0" r="4.5" fill="#8B1E1E"/>
    <path fill="none" stroke="#8B1E1E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" d="M0 -94 L0 -66"/>
    <path fill="none" stroke="#8B1E1E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" d="M0 66 L0 94"/>
    <path fill="none" stroke="#8B1E1E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" d="M-94 0 L-66 0"/>
    <path fill="none" stroke="#8B1E1E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" d="M66 0 L94 0"/>
  </g>

  <text x="800" y="1035" text-anchor="middle" class="word wordmark" font-size="174">HUNTCON</text>

  <g>
    <path class="year-bar" d="M205 1166 H455"/>
    <path class="year-bar" d="M1145 1166 H1395"/>
    <text x="800" y="1210" text-anchor="middle" class="red-fill year" font-size="150">2027</text>
  </g>

  <text x="800" y="1355" text-anchor="middle" class="tagline tagtext" font-size="54">THREAT HUNTING CONFERENCE</text>
</svg>
