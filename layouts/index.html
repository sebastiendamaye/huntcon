{{ define "main" }}
<style>#main-content { display: flex; flex-direction: column; }</style>
<div class="flex items-center justify-center grow text-center px-4">
  <div class="flex flex-col items-center">
    <img src="{{ "images/logo.png" | relURL }}" alt="HUNTCON 2027 Logo" class="h-[45vh] w-auto object-contain -mt-8" />
    <div class="flex flex-col items-center gap-2 mt-20">
      <p class="text-xl text-neutral-200 font-medium max-w-xl">The first European conference dedicated to Threat Hunting.</p>
      <p class="text-lg text-neutral-400">4–5 March 2027<span id="huntcon-countdown" class="text-neutral-500"></span> — La Défense, Paris</p>
      <p class="text-sm text-neutral-500">100 practitioners. 5 talks. 5 round tables. 1 mission.</p>
      <div class="flex gap-4 mt-4">
        <a href="/registration/"
           class="px-6 py-2 rounded-lg bg-gradient-to-r from-cyan-500 to-violet-600 text-white font-semibold hover:opacity-90 transition-opacity">
          Register
        </a>
        <a href="/info/"
           class="px-6 py-2 rounded-lg border border-neutral-600 text-neutral-300 hover:border-neutral-400 hover:text-neutral-100 transition-colors">
          Learn more
        </a>
      </div>
      <a href="https://www.linkedin.com/company/huntcon/" target="_blank" rel="noopener noreferrer"
         class="inline-flex items-center gap-2 text-neutral-300 hover:text-primary-400 transition-colors text-lg mt-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-6 h-6" fill="currentColor"><path d="M416 32H31.9C14.3 32 0 46.5 0 64.3v383.4C0 465.5 14.3 480 31.9 480H416c17.6 0 32-14.5 32-32.3V64.3c0-17.8-14.4-32.3-32-32.3zM135.4 416H69V202.2h66.5V416zm-33.2-243c-21.3 0-38.5-17.3-38.5-38.5S80.9 96 102.2 96c21.2 0 38.5 17.3 38.5 38.5 0 21.3-17.2 38.5-38.5 38.5zm282.1 243h-66.4V312c0-24.8-.5-56.7-34.5-56.7-34.6 0-39.9 27-39.9 54.9V416h-66.4V202.2h63.7v29.2h.9c8.9-16.8 30.6-34.5 62.9-34.5 67.2 0 79.7 44.3 79.7 101.9V416z"/></svg>
        <span>#HUNTCON2027</span>
      </a>
    </div>
  </div>
</div>
<script>
  (function () {
    var el = document.getElementById("huntcon-countdown");
    if (!el) return;
    // Conference runs 4–5 March 2027, starting 09:00 CET (UTC+1).
    var start = Date.parse("2027-03-04T09:00:00+01:00");
    var end = Date.parse("2027-03-05T23:59:59+01:00");
    // Count whole calendar days (local midnight to the event's start date) so the
    // number only ticks over at midnight rather than depending on the hour of day.
    var startDay = new Date(2027, 2, 4);
    function render() {
      var now = Date.now();
      var label;
      if (now >= end) {
        label = "that's a wrap";
      } else if (now >= start) {
        label = "happening now";
      } else {
        var t = new Date();
        var today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
        var days = Math.round((startDay - today) / 86400000);
        label = days === 1 ? "starts tomorrow" : days + " days to go";
      }
      el.textContent = " (" + label + ")";
    }
    render();
    // Refresh hourly so the day count stays accurate across a long-lived tab.
    setInterval(render, 3600000);
  })();
</script>
{{ end }}
